<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffb46e;
            display: flex;
            justify-content: center;
            align-items: center;
           
     
        }

        .container {
            width: min(360px, calc(100% - 24px));
            padding: 24px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
            box-sizing: border-box;
        }

        input,button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            border: none;
            background: #ff742f;
            color: white;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: #fff5e6;
            min-height: 21px;

        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Heat Index Checker</h1>

        <p>Enter temperature and humidity.</p>

        <input type="number" id="Temperature" placeholder="Temperature (°C)">
        <input type="number" id="Humidity" placeholder="Humidity (%)">
        
        <button onclick="showDay()">Check Status</button> 

        <div id="result">Result appears here.</div>
    </div>

    <script>
        function showDay(){
            var temp = parseFloat(document.getElementById("Temperature").value);
            var hum = parseFloat(document.getElementById("Humidity").value);

            var heatIndex = temp + (0.33 * hum) - 4;
            
            var status;

            switch (true) {
                case heatIndex <= 27:
                    status = "Comfortable";
                    break;
                case heatIndex <= 32:
                    status = "Warm";
                    break;
                case heatIndex <= 37:
                    status = "Hot";
                    break;
                case heatIndex < 42:
                    status = "Very Hot";
                    break;
                case heatIndex >= 42:
                    status = "Extremely Hot";
                    break;
                default:
                    status = " Invalid input";
                    break;
            }

            document.getElementById("result").innerHTML = status;
        }
    </script>
</body>
</html>
